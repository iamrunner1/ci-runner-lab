name: Import Check

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.3.10f1
  SRC_REPO: iamrunner1/imouto-ios

jobs:
  import:
    name: Unity import + compile check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          token: ${{ secrets.SRC_TOKEN }}
          fetch-depth: 0

      - name: Show source head
        run: git log -1 --format='src HEAD %h %s'
      - name: Prepare Unity license (from private repo file)
        run: |
          set -e
          if [ ! -f ci/UnityLicense.ulf ]; then echo "::error::ci/UnityLicense.ulf missing"; exit 1; fi
          {
            echo 'UNITY_LICENSE<<__LICENSE_EOF__'
            cat ci/UnityLicense.ulf
            echo
            echo '__LICENSE_EOF__'
          } >> "$GITHUB_ENV"
          echo "license bytes: $(wc -c < ci/UnityLicense.ulf)"
          if [ -f ci/unity_credentials.txt ]; then
            cat ci/unity_credentials.txt >> "$GITHUB_ENV"
            echo "credentials: $(cut -d= -f1 ci/unity_credentials.txt | tr '\n' ' ')"
          else
            echo "::error::ci/unity_credentials.txt missing"; exit 1
          fi

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-import-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-import-
            Library-${{ env.UNITY_VERSION }}-

      - name: Unity batchmode import
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-base-3
          versioning: None
          allowDirtyBuild: true
          customParameters: -nographics

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: |
            Logs/
            *.log
          if-no-files-found: ignore
          retention-days: 7
